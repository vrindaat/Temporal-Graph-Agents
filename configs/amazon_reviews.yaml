# Configuration for Amazon Reviews dataset
# This is the original dataset format

connector:
  type: directory
  config:
    directory: ./data/amazon_data
    pattern: "*.csv"
    connector_type: csv
    connector_config:
      entity_col: brand
      text_col: review_text
      date_col: timestamp
      date_format: "%Y-%m-%d"

entity_extractor:
  type: keyword
  entities:
    - Apple
    - Samsung
    - Sony
    - Nintendo
    - Microsoft
    - Google
    - LG
    - Bose
    - JBL
    - Anker
    - Logitech
    - Razer
    - Corsair
    - Asus
    - Dell
    - HP
    - Lenovo
    - Acer
    - MSI
    - Alienware
    - Nike
    - Adidas
    - Under Armour
    - Puma
    - Reebok
    - KitchenAid
    - Instant Pot
    - Ninja
    - Cuisinart
    - Dyson
    - Philips
    - Panasonic
    - Canon
    - Nikon
    - Fujifilm
    - Xbox
    - Playstation
    - Oculus
    - Valve
  case_sensitive: false

sentiment_classifier:
  type: vader
  pos_threshold: 0.05
  neg_threshold: -0.05

topic_classifier:
  type: zero-shot
  topics:
    - "product quality and durability"
    - "price and value for money"
    - "customer service and delivery"
    - "performance and speed"
    - "ease of use and design"
    - "general opinion"
  model: "facebook/bart-large-mnli"
  confidence_threshold: 0.4

limit: 5000
batch_size: 32
output: ./thesis_graph.pkl
