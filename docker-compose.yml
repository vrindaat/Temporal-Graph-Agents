version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Configuration
      - TGA_CONFIG=/app/configs/pipeline_query_only.yaml

      # Security (CHANGE THESE!)
      - TGA_API_KEY=${TGA_API_KEY:-change-me-in-production}

      # AWS Bedrock (if using)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-2}
    volumes:
      # Mount graph file from host
      - ./thesis_graph.pkl:/app/thesis_graph.pkl:ro

      # Mount configs (optional, for hot-reload)
      - ./configs:/app/configs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for SSL
