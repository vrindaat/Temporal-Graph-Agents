AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TGA Lambda + Bedrock

Parameters:
  GraphS3Bucket:
    Type: String
    Description: S3 bucket containing thesis_graph.pkl
  GraphS3Key:
    Type: String
    Default: thesis_graph.pkl

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: python3.11

Resources:
  TGAFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: ./
      Environment:
        Variables:
          GRAPH_S3_BUCKET: !Ref GraphS3Bucket
          GRAPH_S3_KEY: !Ref GraphS3Key
          BEDROCK_MODEL_ID: meta.llama3-8b-instruct-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource: "*"
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${GraphS3Bucket}/${GraphS3Key}"
      Events:
        Audit:
          Type: Api
          Properties: {Path: /audit, Method: post}
        Brands:
          Type: Api
          Properties: {Path: /brands, Method: get}
        Health:
          Type: Api
          Properties: {Path: /health, Method: get}

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
